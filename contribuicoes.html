<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD CHURCH - Contribuições</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 10px; color: #555; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; }
    button:hover { background: #218838; }
    .status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Dízimos e Ofertas</h2>
    <form id="contribForm">
      <label for="nome">Nome (Opcional):</label>
      <input type="text" id="nome" placeholder="Seu nome">

      <label for="tipo">Tipo:</label>
      <select id="tipo">
        <option value="Entrada">Contribuição</option>
      </select>

      <label for="categoria">Categoria:</label>
      <select id="categoria">
        <option value="Dízimo">Dízimo</option>
        <option value="Oferta">Oferta</option>
        <option value="Oferta Especial">Oferta Especial</option>
      </select>

      <label for="valor">Valor (R$):</label>
      <input type="number" id="valor" step="0.01" required placeholder="0.00">

      <button type="submit">Enviar Contribuição</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz8lxH6Raz0qL4Ly-NgHD0n_Ai4o-P7MwJtGXjgwl8tO1fARZcGffsw7a4E9lU1SwM_/exec";

    document.getElementById("contribForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const status = document.getElementById("status");
      status.innerText = "Enviando...";
      status.style.color = "#000";

      const data = {
        nome: document.getElementById("nome").value,
        tipo: document.getElementById("tipo").value,
        categoria: document.getElementById("categoria").value,
        valor: document.getElementById("valor").value
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(() => {
        status.innerText = "Contribuição registrada com sucesso!";
        status.style.color = "green";
        document.getElementById("contribForm").reset();
      })
      .catch(err => {
        status.innerText = "Erro ao enviar. Tente novamente.";
        status.style.color = "red";
      });
    });
  </script>
</body>
</html>
